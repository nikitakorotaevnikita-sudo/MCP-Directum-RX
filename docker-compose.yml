services:
  mcp-directum-rx:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  mcp-ogv:
    build: .
    command: ["python", "-m", "src.mcp_server"]
    env_file:
      - .env
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
