<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backoffice</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Directum RX Assistant">
      <img class="brand-logo" src="/static/logo.svg" alt="Directum" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
      <span class="brand-fallback">Directum</span>
    </a>
    <div class="app-title">
      <p class="eyebrow">Operations</p>
      <h1>Backoffice</h1>
    </div>
    <a class="btn btn-ghost" href="/">Assistant</a>
  </header>
  <main class="backoffice">
    <section class="connection-panel" aria-label="LLM runtime connection">
      <div class="section-heading">
        <h2>LLM connection</h2>
        <p id="llm-status">Loading current model...</p>
      </div>
      <form id="llm-form" class="connection-form llm-form">
        <div class="field">
          <label for="llm-provider">LLM provider</label>
          <select id="llm-provider" name="provider" required>
            <option value="ollama">Ollama</option>
            <option value="openrouter">OpenRouter</option>
            <option value="openai-compatible">OpenAI compatible</option>
            <option value="ario">Ario</option>
          </select>
        </div>

        <div class="field">
          <label for="llm-base-url">LLM base URL</label>
          <input id="llm-base-url" name="base_url" type="url" autocomplete="url" required>
        </div>

        <div class="field">
          <label for="llm-api-key">LLM API key</label>
          <input id="llm-api-key" name="api_key" type="password" autocomplete="off" placeholder="Keep current">
        </div>

        <div class="field">
          <label for="llm-model">LLM model</label>
          <input id="llm-model" name="model" required>
        </div>

        <div class="field">
          <label for="llm-tool-calling">Tool calling</label>
          <select id="llm-tool-calling" name="tool_calling" required>
            <option value="auto">Auto</option>
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>

        <div class="button-row">
          <button type="button" id="llm-test">Проверить</button>
          <button type="submit">Применить</button>
        </div>
      </form>
    </section>
    <section class="connection-panel" aria-label="Directum RX runtime connection">
      <div class="section-heading">
        <h2>Directum RX connection</h2>
        <p id="rx-status">Loading current connection...</p>
      </div>
      <form id="connection-form" class="connection-form">
        <div class="field">
          <label for="rx-url">Server URL</label>
          <input id="rx-url" name="base_url" type="url" autocomplete="url" required>
        </div>

        <div class="field">
          <label for="rx-login">Login</label>
          <input id="rx-login" name="username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="rx-password">Password</label>
          <input id="rx-password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="button-row">
          <button type="button" id="rx-test">Проверить</button>
          <button type="submit">Применить</button>
        </div>
      </form>
    </section>
    <section class="metrics-grid" aria-label="Product metrics">
      <article class="kpi accent-orange">
        <h2 class="kpi-label">Chat requests</h2>
        <p class="kpi-value" id="chat-requests">0</p>
      </article>
      <article class="kpi accent-amber">
        <h2 class="kpi-label">Preview</h2>
        <p class="kpi-value" id="previews">0</p>
      </article>
      <article class="kpi accent-green">
        <h2 class="kpi-label">Confirmed</h2>
        <p class="kpi-value" id="confirmed">0</p>
      </article>
      <article class="kpi accent-red">
        <h2 class="kpi-label">Errors</h2>
        <p class="kpi-value" id="errors">0</p>
      </article>
    </section>
    <section class="tool-section">
      <h2>Tool calls</h2>
      <div id="tool-calls" class="result-list"></div>
    </section>
  </main>
  <script src="/static/backoffice.js"></script>
</body>
</html>
